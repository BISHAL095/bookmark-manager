type Folder {
  id: ID!
  name: String!
  createdAt: String!
  bookmarks: [Bookmark!]!
}

type Bookmark {
  id: ID!
  title: String!
  url: String!
  tags: [String!]!
  folderId: ID!
  createdAt: String!
  folder: Folder!
}

type BookmarkPage {
  items: [Bookmark!]!
  nextCursor: String
  hasNextPage: Boolean!
}

type Query {
  folders: [Folder!]!
  folder(id: ID!): Folder
  bookmarks(folderId: ID, search: String, take: Int, cursor: String): BookmarkPage!
}

type Mutation {
    createFolder(name: String!): Folder!
    createBookmark(title: String!, url: String!, tags: [String!]!, folderId: ID!): Bookmark!
    updateBookmark(id: ID!, title: String, url: String, tags: [String!]): Bookmark!
    deleteBookmark(id: ID!): ID!
    moveBookmark(id: ID!, folderId: ID!): Bookmark!
}